# Configuración de despliegue en Netlify
# - command: genera la versión final con Vite
# - publish: carpeta que Netlify publica en internet
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# El manifest y el service worker no deben quedarse en caché antigua
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
